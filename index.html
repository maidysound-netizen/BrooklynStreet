<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">

<title>Brooklyn Streets</title>
<style>
  :root { --red:#ff3b30; --yellow:#f2b705; }
  * { box-sizing:border-box; }
  html,body { margin:0; height:100%; overflow:hidden; background:#000; font-family:"Arial Black",Impact,system-ui,sans-serif; color:#fff; user-select:none; }
  canvas#game { display:block; }
  .hidden { display:none !important; }
  #hud { position:fixed; inset:0; pointer-events:none; }
  #cross { position:absolute; left:50%; top:50%; width:22px; height:22px; transform:translate(-50%,-50%); }
  #cross::before,#cross::after { content:""; position:absolute; background:rgba(255,255,255,.9); box-shadow:0 0 2px #000; }
  #cross::before { left:10px; top:0; width:2px; height:22px; }
  #cross::after { top:10px; left:0; height:2px; width:22px; }
  #cross.ads { opacity:.25; }
  #hitm { position:absolute; left:50%; top:50%; width:34px; height:34px; transform:translate(-50%,-50%) rotate(45deg); opacity:0; transition:opacity .15s; }
  #hitm::before,#hitm::after { content:""; position:absolute; background:#fff; }
  #hitm::before { left:16px; top:0; width:2px; height:34px; }
  #hitm::after { top:16px; left:0; height:2px; width:34px; }
  #hitm.head::before,#hitm.head::after { background:var(--red); }
  #top { position:absolute; left:20px; top:16px; text-shadow:0 2px 4px #000; }
  #wave { font-size:28px; letter-spacing:2px; color:var(--yellow); }
  #score { font-size:20px; }
  #left { font-size:14px; font-family:system-ui,sans-serif; font-weight:700; opacity:.85; }
  #map { position:absolute; right:16px; top:16px; width:180px; height:180px; border:2px solid rgba(255,255,255,.5); border-radius:6px; background:rgba(0,0,0,.4); }
  #feed { position:absolute; right:18px; top:206px; text-align:right; font-size:14px; font-family:system-ui,sans-serif; font-weight:800; text-shadow:0 1px 3px #000; }
  #feed div { animation:fade 2.4s forwards; }
  @keyframes fade { 0%,70%{opacity:1} 100%{opacity:0} }
  #hp { position:absolute; left:20px; bottom:20px; display:flex; align-items:center; gap:10px; text-shadow:0 2px 4px #000; }
  #hp .bar { width:220px; height:16px; background:rgba(0,0,0,.5); border:2px solid rgba(255,255,255,.6); border-radius:3px; overflow:hidden; }
  #hpf { height:100%; width:100%; background:linear-gradient(90deg,#3ddc84,#9be15d); transition:width .15s; }
  #hpf.low { background:linear-gradient(90deg,#ff3b30,#ff7a59); }
  #hpt { font-size:26px; min-width:50px; }
  #ammo { position:absolute; right:22px; bottom:18px; text-align:right; text-shadow:0 2px 4px #000; }
  #mag { font-size:48px; }
  #res { font-size:22px; opacity:.8; margin-left:4px; }
  #rl { font-size:14px; font-family:system-ui,sans-serif; font-weight:800; color:var(--yellow); }
  #msg { position:absolute; left:50%; top:28%; transform:translateX(-50%); font-size:54px; letter-spacing:4px; color:var(--yellow); text-shadow:0 3px 10px #000; opacity:0; transition:opacity .4s; white-space:nowrap; }
  #dmg { position:absolute; inset:0; background:radial-gradient(ellipse at center, transparent 45%, rgba(200,0,0,.75) 100%); opacity:0; }
  #dir { position:absolute; left:50%; top:50%; width:220px; height:220px; margin:-110px 0 0 -110px; opacity:0; }
  #dir div { position:absolute; left:50%; top:0; width:70px; height:14px; margin-left:-35px; border-radius:50%/100% 100% 0 0; background:rgba(255,40,30,.9); }
  #menu { position:fixed; inset:0; display:flex; align-items:center; justify-content:center; background:radial-gradient(ellipse at center, rgba(20,10,5,.55), rgba(0,0,0,.85)); cursor:pointer; }
  #menu .box { text-align:center; padding:24px; max-width:560px; }
  #menu h1 { margin:0; font-size:64px; letter-spacing:4px; line-height:1; color:#fff; text-shadow:4px 4px 0 var(--red), 8px 8px 0 rgba(0,0,0,.5); }
  #menu h2 { margin:10px 0 22px; font-family:system-ui,sans-serif; font-weight:800; font-size:18px; color:var(--yellow); letter-spacing:3px; }
  #menu ul { list-style:none; padding:0; margin:0 auto 26px; font-family:system-ui,sans-serif; font-weight:600; font-size:15px; line-height:1.9; text-align:left; display:inline-block; }
  #menu kbd { display:inline-block; min-width:26px; padding:0 6px; margin-right:6px; border-radius:4px; background:#fff; color:#111; font-family:system-ui,sans-serif; font-weight:900; font-size:13px; text-align:center; }
  #menu .go { display:inline-block; padding:14px 34px; font-size:22px; background:var(--yellow); color:#111; border-radius:4px; letter-spacing:2px; animation:pulse 1.4s infinite; }
  #menu .stat { font-family:system-ui,sans-serif; font-weight:800; font-size:20px; margin-bottom:20px; }
  @keyframes pulse { 50% { transform:scale(1.05); } }

  /* touch controls */
  body { touch-action:none; -webkit-touch-callout:none; -webkit-user-select:none; }
  #touch { position:absolute; inset:0; pointer-events:auto; display:none; }
  body.touch #touch { display:block; }
  #stick { position:absolute; left:40px; bottom:50px; width:120px; height:120px; border-radius:50%; background:rgba(255,255,255,.1); border:2px solid rgba(255,255,255,.35); }
  #knob { position:absolute; left:33px; top:33px; width:50px; height:50px; border-radius:50%; background:rgba(255,255,255,.55); }
  .tb { position:absolute; border-radius:50%; background:rgba(0,0,0,.35); border:2px solid rgba(255,255,255,.55); display:flex; align-items:center; justify-content:center; font:800 13px system-ui,sans-serif; color:#fff; }
  .tb.on { background:rgba(242,183,5,.6); }
  #bFire { right:36px; bottom:60px; width:100px; height:100px; background:rgba(255,59,48,.45); font-size:17px; }
  #bAim { right:150px; bottom:36px; width:64px; height:64px; }
  #bReload { right:156px; bottom:116px; width:56px; height:56px; }
  #bJump { right:44px; bottom:176px; width:64px; height:64px; }
  #bTurn { right:150px; bottom:186px; width:54px; height:54px; font-size:22px; }
  #opts { display:none; margin:0 auto 14px; gap:18px; justify-content:center; align-items:center; font:700 14px system-ui,sans-serif; cursor:default; }
  body.touch #opts { display:flex; }
  #opts input[type=range] { width:110px; vertical-align:middle; accent-color:#f2b705; }
  #opts input[type=checkbox] { width:18px; height:18px; vertical-align:middle; accent-color:#f2b705; }
  #bPause { left:50%; top:10px; margin-left:-22px; width:44px; height:44px; border-radius:10px; font-size:16px; }
  body.touch #hp { left:50%; transform:translateX(-50%); bottom:8px; gap:6px; font-size:13px; }
  body.touch #hp .bar { width:150px; height:12px; }
  body.touch #hpt { font-size:18px; min-width:34px; }
  body.touch #ammo { right:auto; left:calc(50% + 34px); top:8px; bottom:auto; text-align:left; }
  body.touch #mag { font-size:28px; }
  body.touch #res { font-size:15px; }
  #rot { display:none; margin-bottom:14px; padding:8px 14px; border-radius:6px; background:rgba(242,183,5,.9); color:#111; font:800 14px system-ui,sans-serif; }
  @media (orientation: portrait) { body.touch #rot { display:inline-block; } }
  @media (max-width: 480px) { #menu h1 { font-size:44px; } }

  /* subway fade + Takako World portal */
  #fade { position:fixed; inset:0; background:#000; opacity:0; pointer-events:none; transition:opacity .35s; }
  #fade.white { background:#fff; }
  #portal { position:fixed; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:10px; text-align:center; overflow:hidden;
    background:radial-gradient(circle at 50% 42%, #5a1a7a 0%, #2a0a45 45%, #0c0418 100%); }
  #portal::before { content:""; position:absolute; inset:-50%; animation:drift 40s linear infinite;
    background-image:radial-gradient(2px 2px at 20px 30px,#fff,transparent),radial-gradient(2px 2px at 140px 80px,#ff9ae6,transparent),radial-gradient(1.5px 1.5px at 90px 150px,#9ae6ff,transparent),radial-gradient(2px 2px at 200px 190px,#fff,transparent),radial-gradient(1.5px 1.5px at 250px 40px,#ffd1f5,transparent);
    background-size:280px 220px; }
  @keyframes drift { to { transform:translate(280px,220px); } }
  #portal img { position:relative; width:min(78vw,620px); max-height:52vh; object-fit:contain; filter:drop-shadow(0 0 30px rgba(255,80,210,.6)); animation:bob 3s ease-in-out infinite; }
  @keyframes bob { 50% { transform:translateY(-10px) rotate(-1deg); } }
  #portal .soon { position:relative; font-size:clamp(28px,6vw,56px); letter-spacing:8px; background:linear-gradient(90deg,#ff7ad9,#c08bff,#7fe3ff); -webkit-background-clip:text; background-clip:text; color:transparent; }
  #portal .tag { position:relative; font:700 clamp(13px,2.2vw,18px) system-ui,sans-serif; color:#f3d6ff; letter-spacing:2px; }
  #portal .back { position:relative; margin-top:14px; padding:12px 28px; border-radius:30px; background:linear-gradient(90deg,#ff4fb8,#8a5cff); font:800 16px system-ui,sans-serif; cursor:pointer; box-shadow:0 0 24px rgba(255,79,184,.5); }
  @media (max-height: 520px) {
    #top { left:14px; top:8px; }
    #wave { font-size:20px; } #score { font-size:15px; } #left { font-size:12px; }
    #map { width:110px; height:110px; right:10px; top:10px; }
    #feed { top:128px; right:12px; font-size:12px; }
    #msg { font-size:34px; }
    #menu h1 { font-size:40px; } #menu h2 { margin:6px 0 10px; font-size:15px; }
    #menu ul { font-size:12px; line-height:1.6; margin-bottom:12px; }
    #menu .go { padding:10px 26px; font-size:18px; }
  }
</style>

<body>

<script type="module">
import * as THREE from 'three';

// ---------- seeded random for the map ----------
let seed = 20250611;
const rnd = () => (seed = (seed * 16807) % 2147483647) / 2147483647;
const rr = (a, b) => a + rnd() * (b - a);
const pick = a => a[Math.floor(rnd() * a.length)];
const rand = (a, b) => a + Math.random() * (b - a);
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));

const TOUCH = matchMedia('(pointer: coarse)').matches;
if (TOUCH) document.body.classList.add('touch');

// ---------- renderer / scene ----------
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.domElement.id = 'game';
renderer.setPixelRatio(Math.min(devicePixelRatio, TOUCH ? 1.5 : 2));
renderer.setSize(innerWidth, innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.15;
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.autoClear = false;
document.body.prepend(renderer.domElement);
const ANISO = renderer.capabilities.getMaxAnisotropy();

const scene = new THREE.Scene();
const HORIZON = 0xf0c49a;
scene.fog = new THREE.Fog(HORIZON, 160, 1500);
const camera = new THREE.PerspectiveCamera(75, innerWidth / innerHeight, 0.05, 3200);
camera.rotation.order = 'YXZ';
scene.add(camera);

const sunDir = new THREE.Vector3(-0.42, 0.36, -0.83).normalize();
const sky = new THREE.Mesh(new THREE.SphereGeometry(2600, 32, 16), new THREE.ShaderMaterial({
  side: THREE.BackSide, depthWrite: false, fog: false,
  uniforms: { top: { value: new THREE.Color(0x4a6fa5) }, hor: { value: new THREE.Color(HORIZON) }, sunCol: { value: new THREE.Color(0xffe2b0) }, sunDir: { value: sunDir } },
  vertexShader: `varying vec3 vD; void main(){ vD = position; gl_Position = projectionMatrix * modelViewMatrix * vec4(position,1.0); }`,
  fragmentShader: `uniform vec3 top; uniform vec3 hor; uniform vec3 sunCol; uniform vec3 sunDir; varying vec3 vD;
    void main(){
      vec3 d = normalize(vD); float h = d.y;
      vec3 c = mix(hor, top, pow(smoothstep(0.0, 0.65, h), 0.7));
      float s = max(dot(d, sunDir), 0.0);
      c += sunCol * (pow(s, 900.0) * 6.0 + pow(s, 14.0) * 0.45);
      if (h < 0.0) c = hor;
      gl_FragColor = vec4(c, 1.0);
      #include <tonemapping_fragment>
      #include <colorspace_fragment>
    }`
}));
sky.renderOrder = -1;
scene.add(sky);

scene.add(new THREE.HemisphereLight(0xcfe0ff, 0x7a5c48, 1.25));
const sun = new THREE.DirectionalLight(0xffcf9a, 3.0);
sun.position.copy(sunDir).multiplyScalar(420);
sun.castShadow = true;
sun.shadow.mapSize.setScalar(TOUCH ? 2048 : 4096);
Object.assign(sun.shadow.camera, { left: -240, right: 240, top: 240, bottom: -240, near: 10, far: 1000 });
sun.shadow.bias = -0.0004;
sun.shadow.normalBias = 0.05;
scene.add(sun, sun.target);

const flashLight = new THREE.PointLight(0xffc070, 0, 14, 2);
scene.add(flashLight);

// ---------- texture helpers ----------
const mkCanvas = (w, h) => Object.assign(document.createElement('canvas'), { width: w, height: h });
function texOf(c, repeat = true) {
  const t = new THREE.CanvasTexture(c);
  t.colorSpace = THREE.SRGBColorSpace;
  if (repeat) t.wrapS = t.wrapT = THREE.RepeatWrapping;
  t.anisotropy = ANISO;
  return t;
}
function shade(hex, amt) {
  const n = parseInt(hex.slice(1), 16);
  const f = v => clamp(Math.round(v + amt), 0, 255);
  return `rgb(${f(n >> 16)},${f((n >> 8) & 255)},${f(n & 255)})`;
}
function noiseTex(base, amt, size = 256, dots = 6000) {
  const c = mkCanvas(size, size), g = c.getContext('2d');
  g.fillStyle = base; g.fillRect(0, 0, size, size);
  for (let i = 0; i < dots; i++) { g.fillStyle = shade(base, rr(-amt, amt)); g.fillRect(rnd() * size, rnd() * size, 2, 2); }
  return c;
}

const STY = {
  red:    { wall: '#8e3b2a', mortar: '#b5a698', trim: '#ece4d4', brick: true },
  dark:   { wall: '#5a2820', mortar: '#7f746a', trim: '#262626', brick: true },
  brown:  { wall: '#6a4434', trim: '#3e271d' },
  yellow: { wall: '#c4a06a', mortar: '#ddd0bb', trim: '#5d4b3a', brick: true },
  cream:  { wall: '#d6c8ae', trim: '#7a6650' },
  ware:   { wall: '#7d5a48', mortar: '#9b9188', trim: '#2a2a2a', brick: true, industrial: true },
  glass:  { glass: true, trim: '#8f9aa3' },
};

function makeFacade(s) {
  const S = 512, B = 128;
  const c = mkCanvas(S, S), e = mkCanvas(S, S);
  const g = c.getContext('2d'), ge = e.getContext('2d');
  ge.fillStyle = '#000'; ge.fillRect(0, 0, S, S);
  if (s.glass) {
    g.fillStyle = '#1d2b38'; g.fillRect(0, 0, S, S);
    for (let by = 0; by < 4; by++) for (let bx = 0; bx < 4; bx++) {
      const x = bx * B, y = by * B, lit = rnd() < 0.18;
      const grd = g.createLinearGradient(x, y, x + B, y + B);
      grd.addColorStop(0, lit ? '#e0c68e' : '#6d8ba4'); grd.addColorStop(1, lit ? '#9c8455' : '#2a3d50');
      g.fillStyle = grd; g.fillRect(x + 4, y + 8, B - 8, B - 14);
      if (lit) { ge.fillStyle = '#ffdca0'; ge.fillRect(x + 4, y + 8, B - 8, B - 14); }
      g.fillStyle = s.trim; g.fillRect(x, y, B, 8); g.fillRect(x, y, 4, B); g.fillRect(x + B / 2 - 1, y, 3, B);
    }
  } else {
    if (s.brick) {
      g.fillStyle = s.mortar; g.fillRect(0, 0, S, S);
      for (let y = 0, row = 0; y < S; y += 8, row++) {
        const off = row % 2 ? 0 : 8;
        for (let x = -16; x < S; x += 16) { g.fillStyle = shade(s.wall, rr(-18, 14)); g.fillRect(x + off + 1, y + 1, 14, 6); }
      }
    } else {
      g.fillStyle = s.wall; g.fillRect(0, 0, S, S);
      for (let k = 0; k < 5000; k++) { g.fillStyle = shade(s.wall, rr(-14, 14)); g.fillRect(rnd() * S, rnd() * S, 2, 2); }
      g.fillStyle = 'rgba(0,0,0,0.13)';
      for (let y = 0; y < S; y += 32) g.fillRect(0, y, S, 2);
    }
    for (let by = 0; by < 4; by++) for (let bx = 0; bx < 4; bx++) {
      const x = bx * B, y = by * B;
      const ww = s.industrial ? 100 : 54, wh = s.industrial ? 86 : 82;
      const wx = x + (B - ww) / 2, wy = y + 24;
      g.fillStyle = s.trim;
      g.fillRect(wx - 7, wy - 13, ww + 14, 11);
      g.fillRect(wx - 5, wy + wh + 2, ww + 10, 7);
      g.fillRect(wx - 3, wy - 3, ww + 6, wh + 6);
      const lit = rnd() < 0.22;
      const grd = g.createLinearGradient(wx, wy, wx + ww, wy + wh);
      if (lit) {
        grd.addColorStop(0, '#ffe2a6'); grd.addColorStop(1, '#d39a52');
        ge.fillStyle = '#ffcf87'; ge.fillRect(wx, wy, ww, wh);
      } else {
        grd.addColorStop(0, '#6a8299'); grd.addColorStop(0.5, '#1c2530'); grd.addColorStop(1, '#2d3a48');
      }
      g.fillStyle = grd; g.fillRect(wx, wy, ww, wh);
      if (rnd() < 0.3) { g.fillStyle = 'rgba(225,212,190,0.88)'; g.fillRect(wx, wy, ww, wh * rr(0.2, 0.6)); }
      g.fillStyle = s.trim;
      if (s.industrial) {
        for (let k = 1; k < 4; k++) g.fillRect(wx + k * ww / 4 - 1, wy, 2, wh);
        for (let k = 1; k < 3; k++) g.fillRect(wx, wy + k * wh / 3 - 1, ww, 2);
      } else {
        g.fillRect(wx, wy + wh * 0.48, ww, 4);
        g.fillRect(wx + ww / 2 - 1.5, wy, 3, wh * 0.5);
      }
    }
  }
  return { map: texOf(c), em: texOf(e) };
}

const SHOPS = ['DELI & GROCERY', 'PIZZA', 'BODEGA 24H', 'LAUNDROMAT', 'BARBER SHOP', 'COFFEE', 'BAGELS', 'LIQUORS', '99¢ STORE', 'TACOS', 'RECORDS', 'HARDWARE', 'NAIL SALON', 'CHINESE FOOD'];
const SIGNCOL = ['#c0392b', '#1f5fa8', '#1e8449', '#b9770e', '#6c3483', '#111111', '#a04000'];
function makeStore() {
  const c = mkCanvas(512, 128), e = mkCanvas(512, 128);
  const g = c.getContext('2d'), ge = e.getContext('2d');
  ge.fillStyle = '#000'; ge.fillRect(0, 0, 512, 128);
  g.fillStyle = '#2a2522'; g.fillRect(0, 0, 512, 128);
  for (let k = 0; k < 2; k++) {
    const x0 = k * 256, col = pick(SIGNCOL), name = pick(SHOPS);
    g.fillStyle = col; g.fillRect(x0 + 4, 4, 248, 30);
    ge.fillStyle = shade(col, -40); ge.fillRect(x0 + 4, 4, 248, 30);
    for (const ctx of [g, ge]) {
      ctx.fillStyle = '#fff'; ctx.font = 'bold 21px Arial'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      ctx.fillText(name, x0 + 128, 20);
    }
    for (let b = 0; b < 2; b++) {
      const bx = x0 + b * 128;
      if (b === 1 && rnd() < 0.5) {
        g.fillStyle = '#3a2f28'; g.fillRect(bx + 40, 42, 48, 86);
        g.fillStyle = '#6a8299'; g.fillRect(bx + 46, 50, 36, 40);
        continue;
      }
      const grd = g.createLinearGradient(bx, 42, bx, 122);
      grd.addColorStop(0, '#f3d6a0'); grd.addColorStop(1, '#8a6a46');
      g.fillStyle = grd; g.fillRect(bx + 8, 42, 112, 80);
      g.fillStyle = 'rgba(0,0,0,0.35)';
      for (let s = 0; s < 3; s++) g.fillRect(bx + 14 + s * 36, 70 + rnd() * 20, 26, 40);
      ge.fillStyle = '#7a5226'; ge.fillRect(bx + 8, 42, 112, 80);
      g.fillStyle = '#1a1a1a'; g.fillRect(bx + 62, 42, 4, 80);
    }
  }
  return { map: texOf(c), em: texOf(e) };
}

const GRAF = ['BKLYN', 'KINGS', 'NYC', 'BK', 'WBURG', 'SPRAY', 'RIDE'];
const GCOL = [['#ff3b30', '#ffcc00'], ['#00c2ff', '#7d3cff'], ['#3ddc84', '#ffe600'], ['#ff2d95', '#ff9f0a'], ['#ffffff', '#5ac8fa']];
function makeGraffiti() {
  const c = mkCanvas(512, 256), g = c.getContext('2d');
  const [a, b] = pick(GCOL), text = pick(GRAF);
  g.translate(256, 135); g.rotate(rr(-0.12, 0.08));
  g.font = 'italic 900 112px "Arial Black", Impact, sans-serif';
  g.textAlign = 'center'; g.textBaseline = 'middle'; g.lineJoin = 'round';
  g.lineWidth = 26; g.strokeStyle = '#111'; g.strokeText(text, 0, 0);
  g.lineWidth = 12; g.strokeStyle = '#fff'; g.strokeText(text, 0, 0);
  const grd = g.createLinearGradient(0, -50, 0, 50); grd.addColorStop(0, a); grd.addColorStop(1, b);
  g.fillStyle = grd; g.fillText(text, 0, 0);
  g.setTransform(1, 0, 0, 1, 0, 0);
  g.strokeStyle = a; g.lineWidth = 3;
  for (let i = 0; i < 6; i++) { const x = rr(90, 420), y = rr(150, 180); g.beginPath(); g.moveTo(x, y); g.lineTo(x, y + rr(15, 60)); g.stroke(); }
  return texOf(c, false);
}

function signTex(name) {
  const c = mkCanvas(256, 52), g = c.getContext('2d');
  g.fillStyle = '#0d6b3a'; g.fillRect(0, 0, 256, 52);
  g.strokeStyle = '#fff'; g.lineWidth = 3; g.strokeRect(4, 4, 248, 44);
  g.fillStyle = '#fff'; g.font = 'bold 28px Arial'; g.textAlign = 'center'; g.textBaseline = 'middle';

}

// ---------- materials ----------
const std = (color, o = {}) => new THREE.MeshStandardMaterial({ color, roughness: 0.85, ...o });
const facadeMats = {};
for (const k in STY) {
  facadeMats[k] = [0, 1].map(() => {
    const { map, em } = makeFacade(STY[k]);
    return new THREE.MeshStandardMaterial({ map, emissiveMap: em, emissive: 0xffffff, emissiveIntensity: 0.55, roughness: STY[k].glass ? 0.35 : 0.9, metalness: STY[k].glass ? 0.25 : 0 });
  });
}
const storeMats = [0, 1, 2, 3, 4].map(() => {
  const { map, em } = makeStore();
  return new THREE.MeshStandardMaterial({ map, emissiveMap: em, emissive: 0xffffff, emissiveIntensity: 0.8, roughness: 0.6 });
});
const graffitiMats = [0, 1, 2, 3, 4, 5].map(() => new THREE.MeshStandardMaterial({ map: makeGraffiti(), transparent: true, alphaTest: 0.05, roughness: 0.9, polygonOffset: true, polygonOffsetFactor: -2 }));
const roofMat = new THREE.MeshStandardMaterial({ map: texOf(noiseTex('#3d3a37', 10)), roughness: 1 });
const white = std(0xffffff);
const box1 = new THREE.BoxGeometry(1, 1, 1);

function scaledBox(w, h, d, uw, uh) {
  const geo = new THREE.BoxGeometry(w, h, d), uv = geo.attributes.uv;
  for (let f = 0; f < 6; f++) {
    const su = (f < 2 ? d : w) / uw, sv = (f === 2 || f === 3 ? d : h) / uh;
    for (let k = 0; k < 4; k++) { const i = f * 4 + k; uv.setXY(i, uv.getX(i) * su, uv.getY(i) * sv); }
  }
  return geo;
}

// ---------- instancing ----------
const buckets = new Map();
const _q = new THREE.Quaternion(), _e = new THREE.Euler(), _p = new THREE.Vector3(), _s = new THREE.Vector3();
function inst(key, geo, mat, x, y, z, o = {}) {
  let b = buckets.get(key);
  if (!b) { b = { geo, mat, m: [], c: [], shadow: o.shadow !== false, hit: !!o.hit }; buckets.set(key, b); }
  _e.set(o.rx || 0, o.ry || 0, o.rz || 0, 'YXZ'); _q.setFromEuler(_e);
  const s = o.s || [1, 1, 1];
  b.m.push(new THREE.Matrix4().compose(_p.set(x, y, z), _q, _s.set(s[0], s[1], s[2])));
  b.c.push(o.color !== undefined ? new THREE.Color(o.color) : null);
}
const staticHit = [];
function flushInst() {
  const W = new THREE.Color(1, 1, 1);
  for (const b of buckets.values()) {
    const im = new THREE.InstancedMesh(b.geo, b.mat, b.m.length);
    const colored = b.c.some(Boolean);
    b.m.forEach((m, i) => { im.setMatrixAt(i, m); if (colored) im.setColorAt(i, b.c[i] || W); });
    im.castShadow = b.shadow; im.receiveShadow = true;
    im.computeBoundingSphere();
    scene.add(im);
    if (b.hit) staticHit.push(im);
  }
}

{

const lampHeadMat = new THREE.MeshStandardMaterial({ color: 0x333333, emissive: 0xffd28a, emissiveIntensity: 1.2 });

function lamp(x, z, nx, nz) {
  const y0 = 0.25;
  inst('pole', geo.pole, poleMat, x, y0 + 3, z);
  inst('arm', box1, poleMat, x + nx * 0.8, y0 + 5.95, z + nz * 0.8, { s: [0.08, 0.08, 1.6], ry: Math.atan2(nx, nz) });
  inst('lampHead', box1, lampHeadMat, x + nx * 1.55, y0 + 5.85, z + nz * 1.55, { s: [0.45, 0.16, 0.75], ry: Math.atan2(nx, nz), shadow: false });

}
const LEAVES = [0x4d7a35, 0x5b8a3c, 0x3f6b2f, 0x6b8f3a, 0x7a8f35];
function tree(x, z, y0 = 0.25, sc = 1) {
  inst('trunk', geo.trunk, trunkMat, x, y0 + 1.6 * sc, z, { s: [sc, sc, sc] });

}

function waterTower(x, y, z) {
  for (const [a, b] of [[-1, -1], [1, -1], [-1, 1], [1, 1]]) inst('twLeg', box1, std(0x2a2522), x + a * 1.1, y + 1.5, z + b * 1.1, { s: [0.18, 3, 0.18] });
  inst('twDeck', box1, std(0x2a2522), x, y + 3, z, { s: [3, 0.15, 3] });
  inst('tank', geo.tank, std(0x6b4a32), x, y + 4.8, z);
  inst('tankRoof', geo.tankRoof, std(0x3a2a20), x, y + 7.2, z);
}

const AWN = [0x1e5a8a, 0x8a1e1e, 0x1e6b3a, 0x222222, 0x8a5a1e, 0x5a1e6b];
function building(x, z, w, d, floors, sk, o = {}) {
  const h = floors * 3.5;
  const m = pick(facadeMats[sk]);
  const mesh = new THREE.Mesh(scaledBox(w, h, d, 14, 14), [m, m, roofMat, roofMat, m, m]);
  mesh.position.set(x, h / 2, z);
  mesh.castShadow = mesh.receiveShadow = true;
  scene.add(mesh); staticHit.push(mesh);
  const s = STY[sk];
  if (!s.glass) {
    inst('cornice', box1, white, x, h + 0.3, z, { s: [w + 0.5, 0.6, d + 0.5], color: s.trim });
    if (floors >= 4 && rnd() < 0.22) waterTower(x + rr(-w / 5, w / 5), h, z + rr(-d / 5, d / 5));
    if (rnd() < 0.5) inst('roofbox', box1, std(0x8a8a86), x + rr(-w / 3, w / 3), h + 0.6, z + rr(-d / 3, d / 3), { s: [rr(1.5, 3), 1.2, rr(1.5, 3)] });
  }
  if (o.front) {
    const fz = z + o.front * d / 2;
    if (o.store) {
      const sm = pick(storeMats);
      const sf = new THREE.Mesh(scaledBox(w + 0.12, 3.5, d + 0.12, 14, 3.5), [sm, sm, roofMat, roofMat, sm, sm]);
      sf.position.set(x, 1.75, z); sf.receiveShadow = true;
      scene.add(sf); staticHit.push(sf);
      inst('awning', box1, white, x, 3.3, fz + o.front * 0.75, { s: [w - 1.2, 0.12, 1.5], rx: o.front * 0.25, color: pick(AWN) });
    }
    if (o.fire && floors >= 3) {
      const bx = x + rr(-w / 4, w / 4);
      for (let f = 1; f < floors; f++) {
        const y = f * 3.5;
        inst('fePlat', box1, std(0x161616, { metalness: 0.5 }), bx, y, fz + o.front * 0.6, { s: [3.4, 0.08, 1.1] });
        inst('feRail', box1, std(0x161616, { metalness: 0.5 }), bx, y + 0.5, fz + o.front * 1.12, { s: [3.4, 0.9, 0.05] });
        if (f < floors - 1) inst('feLadder', box1, std(0x161616, { metalness: 0.5 }), bx, y + 1.75, fz + o.front * 0.6, { s: [3.9, 0.06, 0.45], rz: (f % 2 ? 1 : -1) * 0.82 });
      }
    }
  }
}

function graffiti(x, z, ry, w = 6) {
  const m = new THREE.Mesh(new THREE.PlaneGeometry(w, w / 2), pick(graffitiMats));

const STREETNAMES_X = ['Kent Av', 'Wythe Av', 'Berry St', 'Bedford Av', 'Driggs Av', 'Roebling St', 'Marcy Av', 'Nostrand Av'];
const STREETNAMES_Z = ['Water St', 'Front St', 'Grand St', 'Metropolitan Av', 'Broadway', 'Myrtle Av', 'Fulton St', 'Atlantic Av'];
const signMats = {};
const signMat = n => signMats[n] || (signMats[n] = new THREE.MeshStandardMaterial({ map: signTex(n), side: THREE.DoubleSide, roughness: 0.6 }));

function blockProps(cx, cz, dist) {
  for (const [nx, nz] of [[1, 0], [-1, 0], [0, 1], [0, -1]]) {
    const off = H + 2.4;
    const at = t => [cx + (nx ? nx * off : t), cz + (nz ? nz * off : t)];
    for (const t of [-13, 13]) lamp(...at(t), nx, nz);
    if (dist !== 'warehouse') for (const t of [-6.5, 0, 6.5]) if (rnd() < (dist === 'brownstone' ? 0.9 : 0.45)) tree(...at(t));
    if (rnd() < 0.5) {
      const t = rr(-15, 15), bo = H + 0.6;
      const [bx, bz] = [cx + (nx ? nx * bo : t), cz + (nz ? nz * bo : t)];
      for (let k = 0; k < 4; k++) inst('bag', geo.bag, std(0x111111, { roughness: 0.4 }), bx + rr(-0.8, 0.8), 0.5, bz + rr(-0.8, 0.8), { s: [1, rr(0.7, 1), 1] });
    }
  }
  const [hx, hz] = [cx + rr(-14, 14), cz + H + 2.6];
  inst('hydrant', geo.hydrant, std(0xb3221b), hx, 0.65, hz);
}

const ENTRANCE = { x: 12, z: 37 };   // subway stairs in the park; the open side faces north
function park(cx, cz) {
  const gt = texOf(noiseTex('#4f7a34', 18, 256, 9000)); gt.repeat.set(6, 6);
  const grass = new THREE.Mesh(new THREE.PlaneGeometry(36, 36), new THREE.MeshStandardMaterial({ map: gt, roughness: 1 }));
  grass.rotation.x = -Math.PI / 2; grass.position.set(cx, 0.26, cz); grass.receiveShadow = true;
  scene.add(grass); staticHit.push(grass);
  inst('path', box1, std(0xc8bfae), cx, 0.27, cz, { s: [36, 0.02, 3.2] });
  inst('path', box1, std(0xc8bfae), cx, 0.27, cz, { s: [3.2, 0.02, 36] });
  const basin = new THREE.Mesh(new THREE.CylinderGeometry(4, 4.2, 0.8, 28), std(0x9a948a));
  basin.position.set(cx, 0.65, cz); basin.castShadow = basin.receiveShadow = true; scene.add(basin); staticHit.push(basin);
  const water = new THREE.Mesh(new THREE.CylinderGeometry(3.7, 3.7, 0.1, 28), std(0x3a6f8a, { roughness: 0.1, metalness: 0.4 }));
  water.position.set(cx, 1.0, cz); scene.add(water);
  const col = new THREE.Mesh(new THREE.CylinderGeometry(0.5, 0.8, 2.6, 12), std(0x9a948a));
  col.position.set(cx, 2.1, cz); col.castShadow = true; scene.add(col); staticHit.push(col);
  addCol(cx - 3.6, cx + 3.6, cz - 3.6, cz + 3.6, true);
  for (let k = 0; k < 22; k++) {
    const x = rr(-16, 16), z = rr(-16, 16);
    if (Math.abs(x) < 3 || Math.abs(z) < 3 || Math.hypot(x, z) < 7) continue;
    if (Math.hypot(cx + x - ENTRANCE.x, cz + z - ENTRANCE.z) < 4.5) continue;
    tree(cx + x, cz + z, 0.25, rr(1, 1.4));
  }
  for (const [x, z, ry] of [[-9, 2.4, 0], [9, 2.4, 0], [-9, -2.4, Math.PI], [9, -2.4, Math.PI], [2.4, 10, Math.PI / 2], [-2.4, -10, -Math.PI / 2]]) {
    inst('bench', box1, std(0x6b4a2a), cx + x, 0.7, cz + z, { s: [2.4, 0.12, 0.6], ry });
    inst('benchBack', box1, std(0x6b4a2a), cx + x + Math.sin(ry) * 0.3, 1.05, cz + z + Math.cos(ry) * 0.3, { s: [2.4, 0.5, 0.08], ry });
  }
}

function court(cx, cz) {

  const ft = texOf(fc); ft.repeat.set(36 / 0.5, 4 / 0.5);

  for (const s of [-1, 1]) {

    f.position.set(cx + s * 17.6, 2.25, cz); f.rotation.y = Math.PI / 2; scene.add(f);

function genBlock(i, j, ring) {
  const cx = i * P, cz = j * P;
  inst('sidewalk', box1, sidewalkMat, cx, 0.125, cz, { s: [41, 0.25, 41], hit: true });
  let dist;
  if (ring) dist = 'ring';
  else if (i === 0 && j === 1) dist = 'park';
  else if (i === -2 && j === -1) dist = 'court';
  else if (j === -3) dist = 'warehouse';
  else if (i <= -2 && j >= 1) dist = rnd() < 0.55 ? 'downtown' : 'mixed';
  else dist = rnd() < 0.5 ? 'brownstone' : 'mixed';
  blockInfo.push({ cx, cz, dist });
  if (dist === 'park') { park(cx, cz); blockProps(cx, cz, dist); return; }
  if (dist === 'court') { court(cx, cz); blockProps(cx, cz, dist); return; }
  addCol(cx - H, cx + H, cz - H, cz + H);
  if (!ring) blockProps(cx, cz, dist);
  if (dist === 'warehouse') {
    for (const s of [-1, 1]) building(cx + s * H / 2, cz, H, 2 * H, i === 1 ? 5 : Math.floor(rr(4, 7)), 'ware', { front: 1, fire: false });
    if (i === 1) brooklynSign(cx, 17.5, cz);
    for (const s of [-1, 1]) if (rnd() < 0.7) graffiti(cx + s * (H + 0.03), cz + rr(-10, 10), s * Math.PI / 2, 8);
    return;
  }
  if (dist === 'downtown') {
    building(cx, cz, 2 * H, 2 * H, Math.floor(rr(12, 26)), 'glass');
    return;
  }
  for (const row of [-1, 1]) {
    const rz = cz + row * H / 2;
    let x = -H;
    while (x < H - 0.01) {
      let w = pick([7, 10.5, 10.5, 14]);
      if (H - x - w < 7) w = H - x;
      let sk, floors, store = false, fire = false;
      if (dist === 'brownstone') { sk = pick(['brown', 'brown', 'red', 'cream']); floors = Math.floor(rr(3, 6)); store = rnd() < 0.15; }
      else { sk = pick(['red', 'dark', 'yellow', 'red', 'cream']); floors = Math.floor(rr(4, 8)); store = rnd() < 0.7; fire = rnd() < 0.5; }
      if (ring) floors += 4;
      building(cx + x + w / 2, rz, w, H, floors, sk, { front: row, store, fire });
      x += w;
    }
    for (const s of [-1, 1]) if (!ring && rnd() < 0.35) graffiti(cx + s * (H + 0.1), rz + rr(-4, 4), s * Math.PI / 2, 5.5);
  }
}

// ---------- collision / line of sight ----------
function collide(p, r, sub = false) {
  for (const b of (sub ? subwayCols : colliders)) {
    const cx = clamp(p.x, b.minX, b.maxX), cz = clamp(p.z, b.minZ, b.maxZ);
    const dx = p.x - cx, dz = p.z - cz, d2 = dx * dx + dz * dz;
    if (d2 >= r * r) continue;
    if (d2 > 1e-8) { const d = Math.sqrt(d2); p.x += dx / d * (r - d); p.z += dz / d * (r - d); }
    else {

      const was = this.los;
      this.los = dist < 120 && losClear(p.x, p.z, player.pos.x, player.pos.z);
      if (this.los) { this.target.set(player.pos.x, player.pos.z); if (!was) this.shootT = Math.max(this.shootT, rand(0.5, 1)); }
      else if (was) { this.wp = null; }
    }
    if (!this.los && Math.random() < dt * 0.3) this.target.set(player.pos.x, player.pos.z); // they "hear" you
    let mx = 0, mz = 0, face = null;
    if (this.los) {
      face = Math.atan2(dx, dz);
      const nx = dx / dist, nz = dz / dist;
      if ((this.strafeT -= dt) <= 0) { this.strafeT = rand(0.8, 2); this.strafe = [-1, 0, 1][Math.floor(Math.random() * 3)]; }
      const fw = dist > this.pref + 6 ? 1 : dist < this.pref - 6 ? -0.7 : 0;
      mx = nx * fw - nz * this.strafe * 0.8; mz = nz * fw + nx * this.strafe * 0.8;
      if ((this.shootT -= dt) <= 0 && dist < 90) { this.shoot(dist); this.shootT = rand(0.7, 1.5) / (1 + wave * 0.05); }
    } else {
      if (!this.wp) this.wp = { x: snapNode(p.x), z: snapNode(p.z) };
      const wx = this.wp.x - p.x, wz = this.wp.z - p.z, wd = Math.hypot(wx, wz);
      if (wd < 1.5) this.wp = this.nextNode(this.wp);
      else { mx = wx / wd; mz = wz / wd; }
    }
    const ml = Math.hypot(mx, mz);
    if (ml > 0.01) {
      const sp = this.speed * (this.los ? 0.7 : 1) * dt / ml;
      p.x += mx * sp; p.z += mz * sp;
      if (face === null) face = Math.atan2(mx, mz);
    }
    for (const o of enemies) if (o !== this && !o.dead) {
      const ox = p.x - o.g.position.x, oz = p.z - o.g.position.z, d = Math.hypot(ox, oz);
      if (d < 0.9 && d > 0.001) { p.x += ox / d * (0.9 - d) * 0.5; p.z += oz / d * (0.9 - d) * 0.5; }
    }
    collide(p, 0.45);
    p.y += (groundAt(p.x, p.z) - p.y) * Math.min(1, dt * 12);
    if (face !== null) {
      let da = face - this.g.rotation.y; da = Math.atan2(Math.sin(da), Math.cos(da));
      this.g.rotation.y += da * Math.min(1, dt * 8);
    }
    const moved = Math.hypot(p.x - this.last.x, p.z - this.last.z) / Math.max(dt, 1e-4);
    this.last.set(p.x, 0, p.z);
    if (ml > 0.01 && !this.los && moved < 0.5) { if ((this.stuckT += dt) > 1.2) { this.stuckT = 0; this.prevWp = null; this.wp = this.nextNode({ x: snapNode(p.x), z: snapNode(p.z) }); } } else this.stuckT = 0;
    this.phase += moved * dt * 2.2;
    const sw = Math.sin(this.phase) * Math.min(1, moved / 3) * 0.7;
    this.lL.rotation.x = sw; this.lR.rotation.x = -sw;
    return false;
  }
}

function spawnEnemy() {
  let best = null;
  for (let k = 0; k < 40; k++) {
    const x = NODES[Math.floor(Math.random() * 8)], z = NODES[Math.floor(Math.random() * 8)];
    const d = Math.hypot(x - player.pos.x, z - player.pos.z);
    if (d < 70 || d > 240) continue;
    best = { x, z };
    if (!losClear(x, z, player.pos.x, player.pos.z)) break;
  }
  if (!best) best = { x: -player.pos.x || 175, z: -player.pos.z || 175 };
  enemies.push(new Enemy(best.x + rand(-2, 2), best.z + rand(-2, 2)));
  rebuildParts();
}
function startWave() {
  wave++; toSpawn = 4 + wave * 2; spawnT = 0;
  msg(`WAVE ${wave}`, 2.2); beep(440, 0.15, 0.1, 'sawtooth'); setTimeout(() => beep(660, 0.25, 0.1, 'sawtooth'), 160);
}

// ---------- pickups ----------
const pickups = [];
const pickMats = {
  ammo: new THREE.MeshStandardMaterial({ color: 0xf2b705, emissive: 0xf2b705, emissiveIntensity: 0.5 }),
  hp: new THREE.MeshStandardMaterial({ color: 0x3ddc84, emissive: 0x3ddc84, emissiveIntensity: 0.5 }),
};
function spawnPickup(pos, type) {
  const m = new THREE.Mesh(new THREE.BoxGeometry(0.45, 0.45, 0.45), pickMats[type]);
  m.position.set(pos.x, groundAt(pos.x, pos.z) + 0.5, pos.z); m.castShadow = true;
  scene.add(m); pickups.push({ m, type, t: 0 });
}

// ---------- player damage ----------
let dmgFlash = 0, dirFlash = 0;
function hurtPlayer(d, from) {
  if (state !== 'play') return;
  player.hp -= d; dmgFlash = 0.6; dirFlash = 1;
  const f = new THREE.Vector3(-Math.sin(yaw), 0, -Math.cos(yaw)), r = new THREE.Vector3(Math.cos(yaw), 0, -Math.sin(yaw));
  const v = new THREE.Vector3(from.x - player.pos.x, 0, from.z - player.pos.z);
  $('dir').style.transform = `rotate(${Math.atan2(v.dot(r), v.dot(f))}rad)`;
  beep(110, 0.12, 0.2, 'sawtooth');
  if (player.hp <= 0) gameOver();
}
function gameOver() {
  player.hp = 0; state = 'dead'; firing = false;
  document.exitPointerLock?.();
  $('sub').textContent = '사망했습니다';
  const st = $('stat'); st.classList.remove('hidden');
  st.innerHTML = `WAVE ${wave} · 처치 ${kills} · 점수 ${score}`;
  $('keys').classList.add('hidden'); $('go').textContent = '다시 시작';
  setTimeout(() => $('menu').classList.remove('hidden'), 900);
}

// ---------- shooting ----------
const rc = new THREE.Raycaster(); rc.far = 700;
const ndc = new THREE.Vector2();
// touch aim assist: nearest visible enemy inside a small cone around the crosshair
const ASSIST_CONE = 0.24;
let assistTgt = null;
function findAssistTarget() {
  if (zone !== 'street') return null;
  let best = null;
  const cp = camera.position;
  for (const e of enemies) {
    if (e.dead || !e.los) continue;
    const ex = e.g.position.x - cp.x, ey = e.g.position.y + 1.3 - cp.y, ez = e.g.position.z - cp.z;
    const h = Math.hypot(ex, ez);
    if (h > 90) continue;
    const yawT = Math.atan2(-ex, -ez), pitchT = Math.atan2(ey, h);
    const dyaw = Math.atan2(Math.sin(yawT - yaw), Math.cos(yawT - yaw));
    const ang = Math.hypot(dyaw * Math.cos(pitch), pitchT - pitch);
    if (ang < ASSIST_CONE && (!best || ang < best.ang))
      best = { yawT, pitchT, ang, tol: Math.atan(0.3 / h) + 0.02, dir: new THREE.Vector3(ex, ey, ez).normalize() };
  }
  return best;
}
function fire() {
  ammo--; fireT = 0.095; kick = 1;
  const sp = Math.hypot(player.vel.x, player.vel.z);
  let spread = 0.006 + Math.min(sp, 10) * 0.003 + (player.onGround ? 0 : 0.05);
  if (aiming) spread *= 0.3;
  const a = Math.random() * Math.PI * 2, r = Math.sqrt(Math.random()) * spread;
  ndc.set(Math.cos(a) * r, Math.sin(a) * r * camera.aspect);
  rc.setFromCamera(ndc, camera);
  // touch: shots close enough to the assisted target go straight at it (walls still block)
  if (assistTgt && assistTgt.ang < 0.09) rc.set(camera.position, assistTgt.dir);
  const hits = rc.intersectObjects(enemyParts.concat(staticHit), false);
  const h = hits[0];
  if (h) {
    const e = h.object.userData.enemy;
    if (e) {
      const head = h.object.userData.head;
      e.damage(head ? 100 : rand(26, 36), head);
      spark(h.point, 0xaa1010, 8, 0.3);
      const hm = $('hitm'); hm.className = head ? 'head' : ''; hm.style.opacity = 1;
      clearTimeout(fire.t); fire.t = setTimeout(() => hm.style.opacity = 0, 90);
      beep(head ? 1400 : 900, 0.05, 0.08);
    } else {
      spark(h.point);
      if (h.instanceId === undefined) decal(h);
    }
  }
  recoil += aiming ? 0.008 : 0.014;
  yaw += rand(-0.003, 0.003);
  flash.visible = true; flash.material.rotation = Math.random() * 6; flash.scale.setScalar(rand(0.25, 0.4));
  flashLight.position.copy(camera.position); flashLight.intensity = 30;
  bang(0.55, 3500, 0.22);
}

// ---------- minimap ----------
const mctx = $('map').getContext('2d');
const MS = 180 / 400, mx = x => (x + 200) * MS, mz = z => (z + 200) * MS;
function drawMap() {
  mctx.clearRect(0, 0, 180, 180);
  if (zone === 'subway') {
    mctx.fillStyle = '#1a1a1a'; mctx.fillRect(0, 0, 180, 180);
    mctx.fillStyle = '#a7a9ac'; mctx.beginPath(); mctx.arc(90, 70, 30, 0, 7); mctx.fill();
    mctx.fillStyle = '#fff'; mctx.font = 'bold 34px Arial'; mctx.textAlign = 'center'; mctx.textBaseline = 'middle'; mctx.fillText('L', 90, 72);
    mctx.font = 'bold 18px Arial'; mctx.fillText('Bedford Av', 90, 128);
    return;
  }
  mctx.fillStyle = '#2a4c5c'; mctx.fillRect(0, 0, 180, mz(-196));
  for (const b of blockInfo) {
    mctx.fillStyle = b.dist === 'park' ? '#3f6b3a' : b.dist === 'court' ? '#a5553a' : b.dist === 'ring' ? '#3a332f' : '#6d5a50';
    mctx.fillRect(mx(b.cx - H), mz(b.cz - H), 35 * MS, 35 * MS);
  }
  mctx.fillStyle = '#f2b705';
  for (const pk of pickups) mctx.fillRect(mx(pk.m.position.x) - 1.5, mz(pk.m.position.z) - 1.5, 3, 3);
  mctx.fillStyle = '#ff3b30';
  for (const e of enemies) if (!e.dead) { mctx.beginPath(); mctx.arc(mx(e.g.position.x), mz(e.g.position.z), 2.6, 0, 7); mctx.fill(); }
  mctx.save(); mctx.translate(mx(player.pos.x), mz(player.pos.z));
  mctx.rotate(Math.atan2(-Math.sin(yaw), Math.cos(yaw)));
  mctx.fillStyle = '#fff'; mctx.beginPath(); mctx.moveTo(0, -6); mctx.lineTo(4, 4); mctx.lineTo(-4, 4); mctx.closePath(); mctx.fill();
  mctx.restore();
}

// ---------- subway + portal ----------
function fadeThen(cb, white = false) {
  busy = true;
  const f = $('fade'); f.classList.toggle('white', white); f.style.opacity = 1;
  setTimeout(() => { cb(); f.style.opacity = 0; setTimeout(() => { busy = false; }, 400); }, 380);
}
function placePlayer(x, y, z, yawTo) {
  player.pos.set(x, 0, z); player.y = y; player.vy = 0; player.vel.set(0, 0, 0);
  yaw = yawTo; pitch = 0; turnLeft = 0;
}
function updateSubway(dt) {
  const open = cleared >= DOOR_WAVE;
  doorPivot.rotation.y += ((open ? -1.65 : 0) - doorPivot.rotation.y) * Math.min(1, dt * 1.5);
  doorGlow.material.opacity = open ? 0.95 + Math.sin(t * 3) * 0.05 : 0.3 + Math.sin(t * 2) * 0.08;
  doorLight.intensity = open ? 22 + Math.sin(t * 4) * 4 : 5;
  for (const g of gears) g.gear.rotation.x += g.dir * dt * (open ? 1.2 : 0.25);
  for (const s of doorSparks) {
    s.a += dt * s.sp0; s.h = (s.h + dt * s.sp0) % 4.8;
    s.sp.position.set(DOOR_X - 0.6 - Math.sin(s.a) * 0.4, SY + 0.2 + s.h, ZC + Math.cos(s.a) * s.r);
    s.sp.material.opacity = open ? Math.sin(s.h / 4.8 * Math.PI) : 0;
  }
  if (busy) return;
  const p = player.pos;
  lockMsgT -= dt;
  if (zone === 'street' && Math.abs(p.x - ENTRANCE.x) < 1.15 && Math.abs(p.z - ENTRANCE.z) < 1.7) {
    fadeThen(() => {
      zone = 'subway'; placePlayer(-25.4, SY, ZC, -Math.PI / 2);
      msg('BEDFORD AV', 2);
      if (!open) feed(`지하철역은 안전해요 · 웨이브 ${DOOR_WAVE}을 깨면 무언가 열린다는 소문이…`, '#c08bff');
    });
  } else if (zone === 'subway' && p.x < -26.2) {
    fadeThen(() => { zone = 'street'; placePlayer(ENTRANCE.x, 0.25, ENTRANCE.z - 3.4, 0); });
  } else if (zone === 'subway' && p.x > 28.4 && Math.abs(p.z - ZC) < 1.3) {
    if (open) enterPortal();
    else if (lockMsgT <= 0) { lockMsgT = 3; msg('🔒 LOCKED', 1.5); feed(`단단히 잠겨 있다… 웨이브 ${DOOR_WAVE} 클리어 필요`, '#ff7ad9'); }
  }
}
function enterPortal() {
  state = 'portal'; firing = aiming = false;
  for (const k in keys) keys[k] = false;
  joy.x = joy.y = 0; joy.id = look.id = fireId = null;
  document.exitPointerLock?.();
  beep(660, 0.3, 0.1, 'sine'); setTimeout(() => beep(990, 0.3, 0.1, 'sine'), 150); setTimeout(() => beep(1480, 0.6, 0.1, 'sine'), 300);
  fadeThen(() => { $('hud').classList.add('hidden'); $('portal').classList.remove('hidden'); }, true);
}
$('portalBack').addEventListener('click', () => {
  fadeThen(() => {
    $('portal').classList.add('hidden'); $('hud').classList.remove('hidden');
    placePlayer(25.5, SY, ZC, Math.PI / 2);
    state = 'play';
  });
  if (!TOUCH) { const r = renderer.domElement.requestPointerLock?.(); if (r && r.catch) r.catch(() => {}); }
});

// ---------- main loop ----------
const fwd = new THREE.Vector3(), right = new THREE.Vector3(), wish = new THREE.Vector3();
function update(dt) {
  t += dt;
  fwd.set(-Math.sin(yaw), 0, -Math.cos(yaw)); right.set(Math.cos(yaw), 0, -Math.sin(yaw));
  wish.set(0, 0, 0)
    .addScaledVector(fwd, (keys.KeyW || keys.ArrowUp ? 1 : 0) - (keys.KeyS || keys.ArrowDown ? 1 : 0) - joy.y)
    .addScaledVector(right, (keys.KeyD || keys.ArrowRight ? 1 : 0) - (keys.KeyA || keys.ArrowLeft ? 1 : 0) + joy.x);
  const joySprint = Math.hypot(joy.x, joy.y) > 0.95 && -joy.y > 0.7;
  const sprint = (keys.ShiftLeft || keys.ShiftRight || joySprint) && !aiming && wish.dot(fwd) > 0.3;
  const wl = wish.length();
  if (wl > 0) wish.multiplyScalar(Math.min(wl, 1) / wl * (aiming ? 3.5 : sprint ? 9.5 : 6));
  const acc = player.onGround ? 12 : 2.5;
  player.vel.x += (wish.x - player.vel.x) * Math.min(1, acc * dt);
  player.vel.z += (wish.z - player.vel.z) * Math.min(1, acc * dt);
  player.pos.x += player.vel.x * dt; player.pos.z += player.vel.z * dt;
  collide(player.pos, 0.5, zone === 'subway');
  player.vy -= 20 * dt; player.y += player.vy * dt;
  const gy = zone === 'subway' ? SY : groundAt(player.pos.x, player.pos.z);
  if (player.y <= gy) { player.y = gy; player.vy = 0; player.onGround = true; }
  const speed = Math.hypot(player.vel.x, player.vel.z);
  const bob = player.onGround ? Math.sin(t * (sprint ? 14 : 10)) * Math.min(speed, 9) * 0.006 : 0;
  recoil *= Math.max(0, 1 - dt * 7);
  camera.position.set(player.pos.x, player.y + 1.7 + bob, player.pos.z);
  camera.rotation.set(pitch + recoil, yaw, 0);
  camera.fov += ((aiming ? 52 : 75) - camera.fov) * Math.min(1, dt * 12); camera.updateProjectionMatrix();

  fireT -= dt;
  if (reloading && (reloadT -= dt) <= 0) {
    const n = Math.min(30 - ammo, reserve); ammo += n; reserve -= n; reloading = false; $('rl').textContent = '';
  }
  if (turnLeft > 0) { const step = Math.min(turnLeft, dt * Math.PI / 0.22); yaw += step; turnLeft -= step; }
  let autoFire = false;
  assistTgt = TOUCH ? findAssistTarget() : null;
  if (assistTgt && !turnLeft) {
    const { yawT, pitchT, ang, tol } = assistTgt;
    const active = firing || look.id !== null || joy.id !== null;
    const pull = Math.min(1, (active ? 5 : 2) * (1 - ang / ASSIST_CONE) * dt);
    yaw += Math.atan2(Math.sin(yawT - yaw), Math.cos(yawT - yaw)) * pull;
    pitch += (pitchT - pitch) * pull;
    autoFire = settings.autoFire && ang < tol;
  }
  if ((firing || autoFire) && fireT <= 0 && !reloading && !sprint) { if (ammo > 0) fire(); else { startReload(); fireT = 0.3; if (!reserve) beep(200, 0.05, 0.08); } }

  // the street is frozen while you're underground: the station is a safe room
  const alive = enemies.filter(e => !e.dead).length;
  if (zone === 'street') {
    for (let i = enemies.length - 1; i >= 0; i--) if (enemies[i].update(dt)) { scene.remove(enemies[i].g); enemies.splice(i, 1); }
    if (toSpawn > 0) { if ((spawnT -= dt) <= 0 && alive < Math.min(4 + wave, 10)) { spawnEnemy(); toSpawn--; spawnT = 1.4; } }
    else if (alive === 0 && (waveT -= dt) <= 0) { startWave(); waveT = 5; }
  }
  if (wave > 0 && toSpawn === 0 && alive === 0 && cleared < wave) {
    cleared = wave;
    if (cleared === DOOR_WAVE) { msg('???', 2.5); feed('공원 지하철역에서 이상한 빛이 새어 나온다…', '#ff7ad9'); beep(880, 0.4, 0.08, 'sine'); setTimeout(() => beep(1320, 0.5, 0.08, 'sine'), 200); }
  }
  updateSubway(dt);

  for (let i = pickups.length - 1; i >= 0; i--) {
    if (zone !== 'street') break;
    const pk = pickups[i]; pk.t += dt;
    pk.m.rotation.y += dt * 2; pk.m.position.y = groundAt(pk.m.position.x, pk.m.position.z) + 0.5 + Math.sin(pk.t * 3) * 0.1;
    if (Math.hypot(pk.m.position.x - player.pos.x, pk.m.position.z - player.pos.z) < 1.6) {
      if (pk.type === 'ammo') { reserve += 45; feed('+45 탄약', '#f2b705'); } else { player.hp = Math.min(100, player.hp + 35); feed('+35 체력', '#3ddc84'); }
      beep(880, 0.08, 0.1, 'triangle'); scene.remove(pk.m); pickups.splice(i, 1);
    } else if (pk.t > 40) { scene.remove(pk.m); pickups.splice(i, 1); }
  }

  // viewmodel
  kick *= Math.max(0, 1 - dt * 14);
  const base = aiming ? ADS : HIP;
  gun.position.lerp(base, Math.min(1, dt * 14));
  const gb = player.onGround ? Math.min(speed, 9) / 9 : 0;
  gun.position.x += Math.sin(t * 9) * 0.008 * gb * (aiming ? 0.2 : 1);
  gun.position.y += Math.abs(Math.cos(t * 9)) * 0.01 * gb * (aiming ? 0.2 : 1) - (sprint ? 0.05 : 0);
  gun.position.z += kick * 0.05;
  let rx = kick * 0.07, ry = sprint ? 0.6 : 0;
  if (reloading) { const k = Math.sin((1 - reloadT / 1.6) * Math.PI); rx -= k * 0.7; gun.position.y -= k * 0.12; }
  gun.rotation.x += (rx - gun.rotation.x) * Math.min(1, dt * 20);
  gun.rotation.y += (ry - gun.rotation.y) * Math.min(1, dt * 10);
  if (flash.visible && fireT < 0.06) flash.visible = false;
  flashLight.intensity *= Math.max(0, 1 - dt * 40);

  // HUD
  dmgFlash = Math.max(0, dmgFlash - dt); dirFlash = Math.max(0, dirFlash - dt * 1.2);
  $('dmg').style.opacity = Math.max(dmgFlash, player.hp < 30 ? 0.35 + Math.sin(t * 5) * 0.1 : 0);
  $('dir').style.opacity = dirFlash;
  $('hpf').style.width = Math.max(0, player.hp) + '%';
  $('hpf').classList.toggle('low', player.hp < 30);
  $('hpt').textContent = Math.max(0, Math.ceil(player.hp));
  $('mag').textContent = ammo; $('res').textContent = '/ ' + reserve;
  $('mag').style.color = ammo <= 5 ? '#ff3b30' : '#fff';
  $('wave').textContent = 'WAVE ' + Math.max(wave, 1);
  $('score').textContent = '점수 ' + score;
  $('left').textContent = '남은 적 ' + (alive + toSpawn);
  $('cross').classList.toggle('ads', aiming);
  drawMap();
}

let last = performance.now();
function loop(now) {
  requestAnimationFrame(loop);
  const dt = Math.min(0.05, (now - last) / 1000); last = now;
  if (state === 'play') update(dt);
  else if (state === 'menu') { t += dt; yaw += dt * 0.05; camera.position.set(player.pos.x, 1.7, player.pos.z); camera.rotation.set(0.05, yaw, 0); }
  updateFx(dt);
  sky.position.copy(camera.position);
  renderer.clear();
  renderer.render(scene, camera);
  renderer.clearDepth();
  renderer.render(gunScene, gunCam);
}
requestAnimationFrame(loop);

addEventListener('resize', () => {
  renderer.setSize(innerWidth, innerHeight);
  camera.aspect = gunCam.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix(); gunCam.updateProjectionMatrix();
});

window.__game = { get state() { return state; }, start() { $('menu').click(); }, look(y, p) { yaw = y; pitch = p; }, enemies, player, get assist() { return assistTgt; }, get view() { return { yaw, pitch }; }, get zone() { return zone; }, set cleared(v) { cleared = v; } };
</script>
</body>
</html>
